schema_version: '1.0'

name: '@codemod/use-translations-to-use-extracted'
version: '0.1.1'
description: >-
  Migrate next-intl useTranslations/getTranslations with static keys to
  useExtracted/getExtracted, carrying existing translations into extraction catalogs.
author: 'Codemod <support@codemod.com>'
license: 'MIT'
workflow: 'workflow.yaml'

targets:
  languages: ['tsx', 'typescript', 'javascript']

keywords: ['next-intl', 'i18n', 'useExtracted', 'useTranslations', 'migration', 'nextjs']

registry:
  access: 'public'
  visibility: 'public'

capabilities:
  - fs
