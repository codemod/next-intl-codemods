schema_version: '1.0'

name: '@codemod/next-intl-use-extracted'
version: '0.1.0'
description: >-
  Migrate next-intl useTranslations/getTranslations with static keys to
  useExtracted/getExtracted, carrying existing translations into extraction catalogs.
workflow: 'workflow.yaml'

targets:
  languages: ['tsx', 'typescript', 'javascript']

keywords: ['next-intl', 'i18n', 'useExtracted', 'migration', 'nextjs']

registry:
  access: 'public'
  visibility: 'public'

capabilities:
  - fs
